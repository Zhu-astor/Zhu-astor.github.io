<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>籌碼分析</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0E14;--surface:#151921;--surface-2:#1a1f29;--border:#2A2F3A;--hover:#1E2530;
  --up:#FF453A;--down:#32D74B;--text:#cbd5e1;--text-strong:#f4f6f9;--dim:#6B7280;--muted:#4b5563;
  --accent:#60a5fa;--warn:#f5a623;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter','Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);font-size:22px;min-height:100vh}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

.page{max-width:1360px;margin:0 auto;padding-bottom:110px}

.header{background:var(--surface);border-bottom:1px solid var(--border);padding:20px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.header h1{font-size:36px;font-weight:900;color:#fff;letter-spacing:-.5px}
.header h1 span{color:var(--up)}
.header .meta{font-size:20px;color:var(--dim);font-family:'Roboto Mono',monospace}

.section{padding:20px 32px 0}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 26px}
.panel + .panel{margin-top:18px}
.panel-title{font-size:20px;font-weight:700;color:var(--text-strong);text-transform:uppercase;letter-spacing:.08em;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}

.banner{font-size:20px;color:var(--dim);line-height:1.7}
.banner .warn{color:var(--warn)}
.banner .ok{color:var(--down)}

.toolbar{display:flex;flex-wrap:wrap;gap:28px;align-items:center}
.toolbar .group{display:flex;align-items:center;gap:10px}
.toolbar label{font-size:18px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.chip-row{display:flex;gap:8px}
.chip{padding:9px 18px;border-radius:999px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:20px;cursor:pointer;transition:border-color .15s}
.chip:hover{border-color:var(--muted)}
.chip.active{border-color:var(--accent);color:#fff;background:rgba(96,165,250,.12)}
input.num-input{width:100px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:9px 12px;font-size:20px;font-family:'Roboto Mono',monospace}
button.btn{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:10px 20px;font-size:20px;cursor:pointer;transition:border-color .15s}
button.btn:hover{border-color:var(--muted)}
button.btn:disabled{opacity:.5;cursor:default}
button.btn.accent{background:var(--up);border-color:var(--up);color:#fff;font-weight:700}
button.btn.accent:hover{filter:brightness(1.1)}
#fetch-status,#backfill-status{font-size:18px;color:var(--dim)}

/* Market split — 2-category part-to-whole, direct-labeled (never color-alone) */
.split-label{display:flex;justify-content:space-between;font-size:21px;color:var(--text-strong);margin-bottom:10px;font-weight:600}
.split-track{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface-2)}
.split-seg{height:100%}
.split-seg.listed{background:var(--accent)}
.split-seg.otc{background:#8b7ae0}
.split-seg + .split-seg{margin-left:2px}

.stats{display:flex;gap:18px;flex-wrap:wrap}
.stat-tile{flex:1;min-width:170px}
.stat-tile .label{font-size:17px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;font-weight:700;cursor:help}
.stat-tile .value{font-size:44px;font-weight:700;color:#fff;margin-top:6px}
.stat-tile .hint{font-size:17px;color:var(--dim);margin-top:4px;line-height:1.5}

/* Big condition cards — multi-select toggles. Selecting never navigates by
   itself; the floating bar below is what opens the full-screen result view. */
.grid{padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
.cond-card{background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:24px 26px;cursor:pointer;transition:all .15s;position:relative}
.cond-card:hover{border-color:var(--muted);transform:translateY(-2px)}
.cond-card.active{border-color:var(--up);box-shadow:0 0 0 1px rgba(255,69,58,.35)}
.cond-card .check{position:absolute;top:16px;right:16px;width:28px;height:28px;border-radius:50%;border:2px solid var(--border);color:transparent;font-size:21px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.cond-card.active .check{background:var(--up);border-color:var(--up);color:#fff}
.cond-card .tag{font-size:25px;font-weight:700;color:#fff;margin-bottom:6px;padding-right:30px}
.cond-card .desc{font-size:18px;color:var(--dim);margin-bottom:14px;min-height:38px;line-height:1.5}
.cond-card .count{font-size:42px;font-weight:800;font-family:'Roboto Mono',monospace}
.cond-card .count.bull{color:var(--up)}
.cond-card .count.bear{color:var(--down)}
.cond-card .count.insufficient{font-size:20px;font-weight:700;color:var(--warn);font-family:'Inter',sans-serif}
.cond-card.disabled{opacity:.65}

/* Floating confirm bar — the only thing that navigates anywhere; opens a
   real new browser tab (institutional-result.html) with large, clear
   typography, rather than a small in-page overlay. */
.floating-bar{position:fixed;left:50%;bottom:28px;transform:translate(-50%,120%);opacity:0;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:14px 16px 14px 26px;display:flex;align-items:center;gap:18px;font-size:21px;color:var(--text-strong);box-shadow:0 12px 32px rgba(0,0,0,.5);transition:all .2s;z-index:30}
.floating-bar.show{transform:translate(-50%,0);opacity:1}
.floating-bar button.btn{font-size:21px;padding:12px 22px}

.loading{display:flex;align-items:center;justify-content:center;padding:70px;color:var(--dim);font-size:21px}
.loading .spinner{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--up);border-radius:50%;animation:spin .8s linear infinite;margin-right:14px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="page">

<div class="header">
  <h1>籌碼<span>分析</span></h1>
  <div class="meta" id="stat-date-label">資料日期: --</div>
</div>

<div class="section">
  <div class="panel banner" id="banner"></div>
</div>

<div class="section">
  <div class="panel">
    <div class="toolbar">
      <div class="group">
        <label>市場</label>
        <div class="chip-row" id="market-filter">
          <div class="chip active" data-market="all">全部</div>
          <div class="chip" data-market="listed">上市</div>
          <div class="chip" data-market="otc">上櫃</div>
        </div>
      </div>
      <div class="group">
        <label>大買百分位(前%)</label>
        <input class="num-input" type="number" id="threshold-input" value="10" min="1" max="99">
      </div>
      <div class="group">
        <button class="btn" id="fetch-now-btn">立即抓取今日資料</button>
        <span id="fetch-status"></span>
      </div>
      <div class="group">
        <label>回補天數</label>
        <input class="num-input" type="number" id="backfill-days-input" value="10" min="1" max="60">
        <button class="btn" id="backfill-btn">回補歷史資料</button>
        <span id="backfill-status"></span>
      </div>
      <div class="group">
        <button class="btn" id="saved-combos-btn">📂 已儲存的策略組合</button>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">市場分布</div>
    <div id="market-split"></div>
  </div>

  <div class="panel">
    <div class="panel-title">總覽</div>
    <div class="stats">
      <div class="stat-tile"><div class="label">資料日期</div><div class="value" id="stat-date">--</div></div>
      <div class="stat-tile"><div class="label">總股票數</div><div class="value" id="stat-total">0</div></div>
      <div class="stat-tile">
        <div class="label">已選組合符合</div>
        <div class="value" id="stat-any">--</div>
        <div class="hint">目前勾選的條件「同時」成立的檔數；尚未勾選時顯示 --</div>
      </div>
      <div class="stat-tile"><div class="label">已選條件</div><div class="value" id="stat-sel">0</div></div>
    </div>
  </div>

  <div class="loading" id="loading"><div class="spinner"></div>載入籌碼資料中...</div>

  <div class="panel grid" id="card-grid" style="display:none"></div>
</div>

</div>

<div class="floating-bar" id="floating-bar"></div>

<script type="module" src="js/institutional/main.js"></script>
</body>
</html>
